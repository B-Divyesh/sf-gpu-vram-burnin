name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Matrix runners only build. A single publisher collects every artifact before
# it creates the release, preventing the partial macOS-only race from v0.1.3.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Bundle desktop app
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb

  release:
    name: Publish checksummed release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create SHA256SUMS and latest manifest
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          (cd release-assets && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum) > SHA256SUMS
          find release-assets -type f -printf '%f\n' | sort | jq -Rsc --arg tag "$TAG" --arg repository "$REPOSITORY" '{version: $tag, assets: (split("\n") | map(select(length > 0)) | map({name: ., url: ("https://github.com/" + $repository + "/releases/download/" + $tag + "/" + (gsub(" "; "%20")))}))}' > latest.json
          mv SHA256SUMS latest.json release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          name: VRAM Burn-in Kit ${{ github.ref_name }}
          body: Unsigned desktop builds. Verify SHA256SUMS before installing.
          files: release-assets/*
