[package]
name = "gpu-vram-burnin"
version = "0.1.2"
description = "Bounded GPU VRAM diagnostic receipt"
edition = "2021"

[lib]
name = "gpu_vram_burnin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
pollster = "0.3"
wgpu = "0.19"
